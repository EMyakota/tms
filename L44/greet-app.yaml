apiVersion: apps/v1
kind: Deployment
metadata:
  name: greet-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: greet
  template:
    metadata:
      labels:
        app: greet
    spec:
      containers:
      - name: greet
        image: python:3.11-alpine
        command: ["sh", "-c", "python -m http.server 8000"]
        env:
        - name: GREETING
          valueFrom:
            configMapKeyRef:
              name: greet-values
              key: GREETING
        - name: APP_VERSION
          valueFrom:
            configMapKeyRef:
              name: greet-values
              key: APP_VERSION
        ports:
        - containerPort: 8000
      - name: greet-proxy
        image: nginx
        ports:
          - containerPort: 80
        volumeMounts:
        - name: nginx-conf-vol
          mountPath: /etc/nginx/conf.d/default.conf
          subPath: default.conf
      volumes:
      - name: nginx-conf-vol
        configMap:
          name: nginx-conf
