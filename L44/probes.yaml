apiVersion: v1
kind: Pod
metadata:
  name: probes-pod
  labels:
    app: probes-demo
spec:
  containers:
    - name: demo
      image: anestesia01/dos-31:probes-app
      ports:
        - containerPort: 8080
      readinessProbe:
        httpGet:
          path: /readyz
          port: 8080
        initialDelaySeconds: 5
        periodSeconds: 3
        timeoutSeconds: 2
        failureThreshold: 5
        successThreshold: 1
      livenessProbe:
        httpGet:
          path: /livez
          port: 8080
        initialDelaySeconds: 15
        periodSeconds: 8
        timeoutSeconds: 3
        failureThreshold: 5
        successThreshold: 1

---
apiVersion: v1
kind: Service
metadata:
  name: probes-svc
spec:
  selector:
    app: probes-demo
  ports:
    - port: 8080
      targetPort: 8080
  type: NodePort