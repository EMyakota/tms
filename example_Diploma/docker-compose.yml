services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: ${APP_IMAGE:-ghcr.io/emyakota/example_diploma-service:latest}
    container_name: diploma-app
    environment:
      APP_NAME: tms-diplom-service
      APP_VERSION: local
      APP_ENV: docker
      PORT: 8080
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - diplom-net

  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: diplom-prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    depends_on:
      - app
    networks:
      - diplom-net

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    container_name: diplom-cadvisor
    privileged: true
    ports:
      - "8081:8080"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
    networks:
      - diplom-net

  grafana:
    image: grafana/grafana:11.2.0
    container_name: diploma-grafana
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
      - cadvisor
    networks:
      - diplom-net

networks:
  diplom-net:
    driver: bridge
