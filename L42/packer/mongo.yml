- name: Install mongo
  hosts: all
  become: yes
  vars:
    mongo_version: 7.0
  tasks:
    - name: Install deps
      ansible.builtin.apt:
        name:
          - gnupg2
          - curl
        state: present

    - name: Set repo key
      ansible.builtin.apt_key:
        url: "https://www.mongodb.org/static/pgp/server-{{ mongo_version }}.asc"
        state: present
        keyring: "/usr/share/keyrings/mongodb-server-{{ mongo_version }}.gpg"

    - name: Set repo url
      ansible.builtin.apt_repository:
        repo: "deb [ arch=amd64,arm64 signed-by=/usr/share/keyrings/mongodb-server-{{ mongo_version }}.gpg ] https://repo.mongodb.org/apt/ubuntu jammy/mongodb-org/{{ mongo_version }} multiverse"
        state: present
        update_cache: yes

    - name: Install mongo
      ansible.builtin.apt:
        name: mongodb-org
        state: present
      update_cache: yes