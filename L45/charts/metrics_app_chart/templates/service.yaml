apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-back-service
  namespace:  {{ .Values.namespace }}
spec:
  selector:
    app: {{ .Release.Name }}-backend
  ports:
    - protocol: TCP
      port: {{ .Values.app.service.port }}
      targetPort: {{ .Values.app.service.port }}
  type: ClusterIP