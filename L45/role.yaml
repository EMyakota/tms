apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: robot-role
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "watch", "list"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: robot-role-bind
subjects:
  - kind: User
    name: robot
    apiGroup: rbac.authorization.k8s.io
roleRef:
  kind: Role
  name: robot-role
  apiGroup: rbac.authorization.k8s.io