---
# tasks file for /home/anestesia/bookstore-infra/ansible/roles/setup-postgres
- name: Install additional packages
  apt:
    name:
      - gnupg2
      - software-properties-common
      - apt-transport-https
      - python3-psycopg2
      - acl
    update_cache: yes

- name: Add repo key
  apt_key:
    url: https://www.postgresql.org/media/keys/ACCC4CF8.asc
    state: present

- name: Add postgres repo
  apt_repository:
    state: present
    repo: "deb https://apt.postgresql.org/pub/repos/apt {{ ansible_distribution_release }}-pgdg main"
    update_cache: yes
    filename: postgresql

- name: Install postgres
  apt:
    name: postgresql
    state: present
    update_cache: yes

- name: Set listen addr
  lineinfile:
    path: "/etc/postgresql/{{ pg_version }}/main/postgresql.conf"
    regexp: '^#listen_addresses'
    line: "listen_addresses = '0.0.0.0'"
  notify: restart postgres

- name: Set access for backends
  lineinfile:
    path: "/etc/postgresql/{{ pg_version }}/main/pg_hba.conf"
    line: "host all all 0.0.0.0/0 md5"
    state: present
  notify: restart postgres

- name: Create user
  become: true
  become_user: postgres
  postgresql_user:
    name: "{{ db_user }}"
    password: "{{ db_pass }}"

- name: Create db
  become: true
  become_user: postgres
  postgresql_db:
    name: "{{ db_name }}"
    owner: "{{ db_user }}"

- name: Create table
  become: true
  become_user: postgres
  postgresql_table:
    db: "{{ db_name }}"
    name: "{{ table_name }}"
    owner: "{{ db_user }}"
    columns:
      - id serial
      - title varchar(100)
      - author varchar(100)
      - price float
      - primary key(id)
