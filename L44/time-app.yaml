apiVersion: apps/v1
kind: Deployment
metadata:
  name: time-dpl
spec:
  replicas: 4
  strategy:
    rollingUpdate:
      maxSurge: 2
      maxUnavailable: 1
  selector:
    matchLabels:
      app: time
  template:
    metadata:
      labels:
        app: time
      annotations:
        kubernetes.io/change-cause: "Release v2.0"
    spec:
      containers:
        - name: app
          image: anestesia01/k8s-demo:time-app-2.0.0
          ports:
            - containerPort: 8000
---
apiVersion: v1
kind: Service
metadata:
  name: time-svc
spec:
  selector:
    app: time
  ports:
    - port: 8001
      targetPort: 8000