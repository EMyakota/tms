name: diploma-ci-cd

on:
  push:
    branches:
      - "**"
  pull_request:

env:
  GO_VERSION: "1.25.1"
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/diploma-service

jobs:
  test-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Diploma
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Download dependencies
        run: go mod download

      - name: Lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: v1.60
          working-directory: Diploma

      - name: Format check
        run: test -z "$(gofmt -l .)"

      - name: Vet
        run: go vet ./...

      - name: Unit tests
        run: go test ./... -coverprofile=coverage.out

      - name: Build binary
        run: go build -o bin/diploma-service .

      - name: Build docker image
        run: docker build -t diploma-service:test .

      - name: Smoke test built image
        run: |
          docker run -d --name diploma-service-smoke -p 18080:8080 diploma-service:test
          for i in {1..20}; do
            if curl -fsS http://127.0.0.1:18080/healthz; then
              break
            fi
            sleep 2
          done
          curl -fsS http://127.0.0.1:18080/healthz
          docker rm -f diploma-service-smoke

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: diploma-service-binary
          path: Diploma/bin/diploma-service

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: diploma-service-coverage
          path: Diploma/coverage.out

  docker:
    runs-on: ubuntu-latest
    needs: test-build
    if: github.event_name == 'push'
    permissions:
      contents: read
      packages: write
    defaults:
      run:
        working-directory: Diploma
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: ./Diploma
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  deploy:
    runs-on: ubuntu-latest
    needs: docker
    if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'
    steps:
      - name: Deploy to target host
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            cd /opt/diploma-service
            export APP_IMAGE=${{ env.IMAGE_NAME }}:latest
            docker compose pull
            docker compose up -d

  notify:
    runs-on: ubuntu-latest
    needs:
      - test-build
      - docker
      - deploy
    if: always() && github.event_name == 'push'
    steps:
      - name: Telegram notification
        if: ${{ secrets.TELEGRAM_BOT_TOKEN != '' && secrets.TELEGRAM_CHAT_ID != '' }}
        uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.TELEGRAM_CHAT_ID }}
          token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          message: |
            Diploma pipeline: ${{ job.status }}
            Repository: ${{ github.repository }}
            Branch: ${{ github.ref_name }}
            Commit: ${{ github.sha }}
